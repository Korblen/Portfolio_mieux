<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00ffea"/>
      <stop offset="1" stop-color="#3498db"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="#121720"/>
  <rect x="6" y="6" width="52" height="52" rx="13" fill="url(#bg)" opacity="0.18"/>
  <rect x="7" y="7" width="50" height="50" rx="12" fill="none" stroke="url(#bg)" stroke-width="2"/>
  <text x="32" y="38" text-anchor="middle" fill="#00ffea" filter="url(#glow)" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="800" letter-spacing="0">MB</text>
</svg>
